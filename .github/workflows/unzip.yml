name: Extract KIM-ADDONS ZIP

on:
  push:
    branches:
      - main

jobs:
  extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -o KIM-ADDONS-GitHub.zip -d extracted

          if [ "$(find extracted -mindepth 1 -maxdepth 1 | wc -l)" = "1" ] && [ -d "$(find extracted -mindepth 1 -maxdepth 1 -type d)" ]; then
            folder="$(find extracted -mindepth 1 -maxdepth 1 -type d)"
            cp -r "$folder"/. .
          else
            cp -r extracted/. .
          fi

          rm -rf extracted
          rm -f KIM-ADDONS-GitHub.zip

      - name: Save files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Extract KIM-ADDONS project"
          git push
